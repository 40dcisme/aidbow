name: Auto PR
# 机制修复：Agent(CRON) 无本地 GitHub token，故由 GitHub 自己在 push 分支时开 PR。
on:
  push:
    branches: ['feat/**', 'fix/**', 'chore/**']
permissions:
  contents: read
  pull-requests: write
jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open PR if none exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          BR="${GITHUB_REF_NAME}"
          echo "repo=${GITHUB_REPOSITORY} branch=$BR token_set=$([ -n "$GH_TOKEN" ] && echo yes || echo no)"
          existing=$(gh pr list --head "$BR" --state open --json number --jq '.[].number' || true)
          if [ -n "$existing" ]; then echo "PR already open: $existing"; exit 0; fi
          if ! gh pr create --base main --head "$BR" --title "PR: $BR" --body "Automated PR for branch $BR."; then
            echo "::error::gh pr create failed (see above). Likely cause: Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests' is OFF, or workflow permissions are read-only."
            exit 1
          fi
