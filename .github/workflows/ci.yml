name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Run all tests (zero-dep)
        run: python3 run_all_tests.py
      - name: Smoke - end-to-end demo
        run: python3 examples/run_demo.py
      - name: Smoke - P-system demo
        run: python3 examples/run_pdemo.py
      - name: Environment self-check
        run: python3 scripts/check_env.py
